<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#37474f"/>
    </marker>
    <marker id="arrd" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#90a4ae"/>
    </marker>
  </defs>
  <style>
    .box{rx:8;stroke-width:1.5;}
    .lbl{font-size:12px;fill:#102027;}
    .sub{font-size:10px;fill:#37474f;}
    .stage{fill:#e3f2fd;stroke:#1565c0;}
    .io{fill:#eceff1;stroke:#455a64;}
    .safe{fill:#fff3e0;stroke:#e65100;}
    .store{fill:#f1f8e9;stroke:#558b2f;}
    .eval{fill:#f3e5f5;stroke:#6a1b9a;}
    .edge{stroke:#37474f;stroke-width:1.6;fill:none;}
    .dash{stroke:#90a4ae;stroke-width:1.3;fill:none;stroke-dasharray:4 3;}
    .t{font-size:13px;font-weight:bold;fill:#0d47a1;}
  </style>

  <text x="20" y="26" class="t">GraphRAG executor — four stages (D3)</text>

  <!-- Question + first pass -->
  <rect class="box io" x="20" y="50" width="120" height="44"/>
  <text class="lbl" x="80" y="77" text-anchor="middle">Question</text>

  <rect class="box io" x="20" y="120" width="160" height="56"/>
  <text class="lbl" x="100" y="143" text-anchor="middle">First-pass retrieval</text>
  <text class="sub" x="100" y="160" text-anchor="middle">BM25 + dense → seeds</text>

  <!-- Stage 1 -->
  <rect class="box stage" x="230" y="50" width="190" height="64"/>
  <text class="lbl" x="325" y="72" text-anchor="middle">1 · Subgraph by Cypher</text>
  <text class="sub" x="325" y="90" text-anchor="middle">weighted_subgraph</text>
  <text class="sub" x="325" y="104" text-anchor="middle">similar + topic + author</text>

  <!-- Stage 2 -->
  <rect class="box stage" x="230" y="140" width="190" height="60"/>
  <text class="lbl" x="325" y="164" text-anchor="middle">2 · Expand to chunks</text>
  <text class="sub" x="325" y="182" text-anchor="middle">pinned dense over subgraph</text>

  <!-- Safety -->
  <rect class="box safe" x="470" y="140" width="180" height="60"/>
  <text class="lbl" x="560" y="164" text-anchor="middle">Provenance filter</text>
  <text class="sub" x="560" y="182" text-anchor="middle">source pin + injection scrub</text>

  <!-- Stage 3 -->
  <rect class="box stage" x="470" y="50" width="180" height="64"/>
  <text class="lbl" x="560" y="72" text-anchor="middle">3 · Blend + rerank</text>
  <text class="sub" x="560" y="90" text-anchor="middle">semantic-MMR</text>
  <text class="sub" x="560" y="104" text-anchor="middle">+ graph prior</text>

  <!-- Stage 4 -->
  <rect class="box stage" x="700" y="50" width="180" height="64"/>
  <text class="lbl" x="790" y="72" text-anchor="middle">4 · Answer</text>
  <text class="sub" x="790" y="90" text-anchor="middle">grounded, cited,</text>
  <text class="sub" x="790" y="104" text-anchor="middle">page ranges</text>

  <rect class="box io" x="700" y="140" width="180" height="50"/>
  <text class="lbl" x="790" y="170" text-anchor="middle">Cited answer</text>

  <!-- Stores -->
  <rect class="box store" x="230" y="250" width="150" height="48"/>
  <text class="lbl" x="305" y="270" text-anchor="middle">MongoDB</text>
  <text class="sub" x="305" y="285" text-anchor="middle">chunks + provenance</text>
  <rect class="box store" x="400" y="250" width="150" height="48"/>
  <text class="lbl" x="475" y="270" text-anchor="middle">Qdrant</text>
  <text class="sub" x="475" y="285" text-anchor="middle">bge vectors</text>
  <rect class="box store" x="570" y="250" width="170" height="48"/>
  <text class="lbl" x="655" y="270" text-anchor="middle">Neo4j</text>
  <text class="sub" x="655" y="285" text-anchor="middle">CITES + SIMILAR_TO</text>

  <!-- Eval -->
  <rect class="box eval" x="700" y="340" width="180" height="56"/>
  <text class="lbl" x="790" y="363" text-anchor="middle">Evaluation</text>
  <text class="sub" x="790" y="380" text-anchor="middle">faith · ans-rel · recall · p95</text>

  <!-- edges -->
  <path class="edge" d="M80,94 L80,120" marker-end="url(#arr)"/>
  <path class="edge" d="M180,140 L230,90" marker-end="url(#arr)"/>
  <path class="edge" d="M325,114 L325,140" marker-end="url(#arr)"/>
  <path class="edge" d="M180,160 L230,170" marker-end="url(#arr)"/>
  <path class="edge" d="M420,170 L470,170" marker-end="url(#arr)"/>
  <path class="edge" d="M560,140 L560,114" marker-end="url(#arr)"/>
  <path class="edge" d="M650,82 L700,82" marker-end="url(#arr)"/>
  <path class="edge" d="M790,114 L790,140" marker-end="url(#arr)"/>

  <!-- store dashed feeds -->
  <path class="dash" d="M475,250 L150,176" marker-end="url(#arrd)"/>
  <path class="dash" d="M475,250 L325,200" marker-end="url(#arrd)"/>
  <path class="dash" d="M655,250 L360,108" marker-end="url(#arrd)"/>
  <path class="dash" d="M305,250 L760,114" marker-end="url(#arrd)"/>
  <path class="dash" d="M790,190 L790,340" marker-end="url(#arrd)"/>
</svg>

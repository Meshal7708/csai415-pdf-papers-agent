# Stores for the D2 retrieval stack. One command brings up all three:
#     docker compose up -d
# then export the URLs from .env (see .env.example) and run the seed scripts.
services:
  mongo:
    image: mongo:7
    container_name: papers_mongo
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_DATABASE: papers_ai
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: papers_qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.22
    container_name: papers_neo4j
    ports: ["7474:7474", "7687:7687"]   # 7474 = browser UI, 7687 = bolt
    environment:
      NEO4J_AUTH: neo4j/test1234
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "test1234", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  mongo_data:
  qdrant_data:
  neo4j_data:

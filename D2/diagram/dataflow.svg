<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="Helvetica,Arial,sans-serif" font-size="13">
  <rect width="980" height="460" fill="#ffffff"/>
  <!-- lanes -->
  <rect x="10"  y="40" width="230" height="400" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <rect x="260" y="40" width="300" height="400" rx="10" fill="#ecfdf5" stroke="#bbf7d0"/>
  <rect x="580" y="40" width="390" height="400" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="125" y="64" text-anchor="middle" font-weight="bold" fill="#3730a3">INGEST</text>
  <text x="410" y="64" text-anchor="middle" font-weight="bold" fill="#047857">STORES</text>
  <text x="775" y="64" text-anchor="middle" font-weight="bold" fill="#b91c1c">RETRIEVAL  ·  /search</text>

  <!-- ingest boxes -->
  <g fill="#ffffff" stroke="#6366f1">
    <rect x="40" y="90"  width="170" height="48" rx="6"/>
    <rect x="40" y="160" width="170" height="56" rx="6"/>
    <rect x="40" y="238" width="170" height="64" rx="6"/>
    <rect x="40" y="324" width="170" height="56" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#1e1b4b">
    <text x="125" y="119">arXiv PDFs</text>
    <text x="125" y="183">parse_pdf</text><text x="125" y="201" font-size="11" fill="#555">pypdf + page map</text>
    <text x="125" y="262">chunk_pages</text><text x="125" y="279" font-size="11" fill="#555">900c / 150 overlap</text><text x="125" y="294" font-size="11" fill="#555">+ page range + offsets</text>
    <text x="125" y="350">bge-small-en-v1.5</text><text x="125" y="367" font-size="11" fill="#555">fastembed ONNX · 384-d</text>
  </g>
  <g stroke="#6366f1" fill="none" marker-end="url(#a)">
    <line x1="125" y1="138" x2="125" y2="160"/>
    <line x1="125" y1="216" x2="125" y2="238"/>
    <line x1="125" y1="302" x2="125" y2="324"/>
  </g>

  <!-- stores cylinders -->
  <g>
    <rect x="285" y="92"  width="250" height="86" rx="10" fill="#ffffff" stroke="#10b981"/>
    <rect x="285" y="196" width="250" height="86" rx="10" fill="#ffffff" stroke="#10b981"/>
    <rect x="285" y="300" width="250" height="100" rx="10" fill="#ffffff" stroke="#10b981"/>
  </g>
  <g text-anchor="middle" fill="#064e3b">
    <text x="410" y="120" font-weight="bold">MongoDB</text>
    <text x="410" y="140" font-size="11">documents · chunks</text>
    <text x="410" y="156" font-size="11">provenance · runs · TTL cache</text>
    <text x="410" y="224" font-weight="bold">Qdrant</text>
    <text x="410" y="244" font-size="11">chunk vectors · cosine</text>
    <text x="410" y="260" font-size="11">payload index (paper_id/topic)</text>
    <text x="410" y="328" font-weight="bold">Neo4j</text>
    <text x="410" y="348" font-size="11">Author-WROTE-Paper</text>
    <text x="410" y="364" font-size="11">Paper-ABOUT-Topic</text>
    <text x="410" y="380" font-size="11">Paper-PUBLISHED_IN-Venue</text>
  </g>
  <!-- ingest -> stores -->
  <g stroke="#10b981" fill="none" marker-end="url(#b)">
    <path d="M210 262 C 250 200, 250 150, 285 135"/>
    <path d="M210 352 C 250 320, 250 250, 285 239"/>
    <path d="M210 270 C 250 330, 250 350, 285 350"/>
  </g>

  <!-- retrieval -->
  <g fill="#ffffff" stroke="#ef4444">
    <rect x="600" y="92"  width="120" height="40" rx="6"/>
    <rect x="600" y="170" width="150" height="40" rx="6"/>
    <rect x="600" y="226" width="150" height="40" rx="6"/>
    <rect x="800" y="198" width="150" height="56" rx="6"/>
    <rect x="600" y="320" width="350" height="64" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#7f1d1d">
    <text x="660" y="117">query</text>
    <text x="675" y="195">BM25 over chunks</text>
    <text x="675" y="251">dense ANN (Qdrant)</text>
    <text x="875" y="222" font-weight="bold">min-max fuse</text><text x="875" y="240" font-size="11">λ·bm25 + (1-λ)·dense</text>
    <text x="775" y="346" font-weight="bold">top-k chunks</text><text x="775" y="366" font-size="11">+ citation + page range (pp. X–Y)</text>
  </g>
  <g stroke="#ef4444" fill="none" marker-end="url(#c)">
    <line x1="660" y1="132" x2="660" y2="170"/>
    <line x1="660" y1="132" x2="660" y2="226"/>
    <line x1="750" y1="190" x2="800" y2="216"/>
    <line x1="750" y1="246" x2="800" y2="236"/>
    <line x1="875" y1="254" x2="800" y2="335"/>
  </g>
  <!-- store feeds into retrieval (dashed) -->
  <g stroke="#9ca3af" fill="none" stroke-dasharray="4 3" marker-end="url(#d)">
    <path d="M535 220 C 560 200, 575 195, 600 190"/>
    <path d="M535 235 C 560 240, 575 245, 600 246"/>
    <path d="M535 350 C 560 345, 575 340, 600 352"/>
  </g>
  <text x="565" y="186" font-size="10" fill="#6b7280">texts</text>
  <text x="565" y="262" font-size="10" fill="#6b7280">vectors</text>
  <text x="560" y="332" font-size="10" fill="#6b7280">titles/pages · 2-hop (D3)</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6366f1"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/></marker>
    <marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
    <marker id="d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9ca3af"/></marker>
  </defs>
</svg>
